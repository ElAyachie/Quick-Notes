plugins {
    alias(libs.plugins.android.application)
}

// Machine-local values (SDK path, API keys) live in local.properties, which is not committed.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Release signing. The keystore is never committed: the release workflow (and anyone building a
// signed release on their own computer) points at it with these environment variables. Without
// them the release build comes out unsigned.
def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace 'com.myapp.quicknotes'
    compileSdk 36

    defaultConfig {
        // Keep the published applicationId so Play Store updates still apply.
        applicationId "com.myapp.QuickNotes1"
        minSdk 26
        targetSdk 36
        versionCode 56
        versionName "3.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The Google Maps key for the place picker. Without it the map shows no tiles.
        manifestPlaceholders = [MAP_API_KEY: localProperties.getProperty("MAP_API_KEY", "")]

        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes the schema of each database version here; needed for migrations.
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "release"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            // MediaPipe (search by meaning) brings a native library of 10 to 15 MB for each kind
            // of processor. Phones are ARM; the x86 ones only serve emulators, which run debug
            // builds, so the release APK leaves them out.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        // Migration tests read the exported database schemas.
        androidTest.assets.srcDir "$projectDir/schemas"
    }
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler
    implementation libs.androidx.viewpager2
    implementation libs.material
    implementation libs.mediapipe.tasks.text
    implementation libs.play.services.location
    implementation libs.play.services.maps

    testImplementation libs.junit
    // The real org.json, for parsing in JVM tests; Android's own is only a stub there.
    testImplementation libs.json
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
}
